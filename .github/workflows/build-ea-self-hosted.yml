# =============================================================================
# EA Build & Release Workflow (Self-Hosted Runner)
# =============================================================================
# 使用本地 Self-Hosted Runner 编译 EA
# 前置条件：
#   1. 在本地机器配置 Self-Hosted Runner
#   2. 安装 MT5 并确认 MetaEditor 路径
# =============================================================================

name: Build EA (Self-Hosted)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: true
        type: boolean

  # 推送到 EA_2.x.x 分支时触发
  push:
    branches:
      - 'EA_2.*'
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - 'Core/**'
      - 'Strategies/**'

# 权限配置
permissions:
  contents: write

env:
  EA_SOURCE: 'Ea_run.mq5'
  EA_OUTPUT: 'Ea_run.ex5'
  # MT5 路径 - 根据实际安装位置修改
  MT5_PATH: 'C:\Program Files\MetaTrader 5'
  # 或使用便携版路径
  # MT5_PATH: 'C:\MT5\MetaTrader 5'

jobs:
  # ===========================================================================
  # Job 1: 版本管理
  # ===========================================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -oP '#define EA_VERSION_STRING\s+"\K[^"]+' Core/Version.mqh || echo "2.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Calculate new version
        id: version
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP="${{ github.event.inputs.version_bump || 'minor' }}"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW_VERSION"
          COMMIT_SHA="${GITHUB_SHA:0:7}"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (tag: $TAG)"

  # ===========================================================================
  # Job 2: 编译 EA (Self-Hosted Windows Runner)
  # ===========================================================================
  build:
    needs: version
    runs-on: self-hosted-windows  # Self-Hosted Runner 标签
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Find MetaEditor
        id: find-editor
        shell: powershell
        run: |
          # 常见 MT5 安装路径
          $possiblePaths = @(
            "${{ env.MT5_PATH }}\MetaEditor64.exe",
            "C:\Program Files\MetaTrader 5\MetaEditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\MetaEditor64.exe",
            "C:\MT5\MetaTrader 5\MetaEditor64.exe",
            "${env:APPDATA}\MetaQuotes\Terminal\*\MetaEditor64.exe"
          )
          
          $editor = $null
          foreach ($path in $possiblePaths) {
            if ($path -like "*`*`*") {
              # 通配符路径
              $matched = Get-Item $path -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($matched) {
                $editor = $matched.FullName
                break
              }
            } elseif (Test-Path $path) {
              $editor = $path
              break
            }
          }
          
          if (-not $editor) {
            Write-Host "ERROR: MetaEditor not found in any known location"
            Write-Host "Searched paths:"
            $possiblePaths | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          
          Write-Host "Found MetaEditor: $editor"
          echo "editor=$editor" >> $env:GITHUB_OUTPUT
          echo "mt5_dir=$(Split-Path $editor -Parent)" >> $env:GITHUB_OUTPUT
      
      - name: Compile EA
        id: compile
        shell: powershell
        run: |
          $EDITOR = "${{ steps.find-editor.outputs.editor }}"
          $WORKSPACE = "${{ github.workspace }}"
          $SOURCE = "$WORKSPACE\${{ env.EA_SOURCE }}"
          $LOG = "$WORKSPACE\compile.log"
          
          Write-Host "=========================================="
          Write-Host "Compiling EA..."
          Write-Host "  Source: $SOURCE"
          Write-Host "  Editor: $EDITOR"
          Write-Host "=========================================="
          
          # MetaEditor 命令行参数
          # /compile: 源文件
          # /log: 日志文件
          # /include: include 路径
          
          $includePath = $WORKSPACE
          
          # 启动编译（静默模式）
          $process = Start-Process -FilePath $EDITOR `
            -ArgumentList "/compile:`"$SOURCE`"", "/log:`"$LOG`"", "/include:`"$includePath`"" `
            -NoNewWindow -PassThru -Wait
          
          # 等待文件写入完成
          Start-Sleep -Seconds 3
          
          # 检查输出
          $outputPath = "$WORKSPACE\${{ env.EA_OUTPUT }}"
          
          Write-Host ""
          Write-Host "=== Compilation Result ==="
          
          if (Test-Path $outputPath) {
            $fileInfo = Get-Item $outputPath
            Write-Host "SUCCESS: $outputPath"
            Write-Host "  Size: $($fileInfo.Length) bytes"
            Write-Host "  Modified: $($fileInfo.LastWriteTime)"
            echo "success=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "FAILED: Output file not found"
            if (Test-Path $LOG) {
              Write-Host ""
              Write-Host "=== Compile Log ==="
              Get-Content $LOG -Encoding UTF8
            }
            echo "success=false" >> $env:GITHUB_OUTPUT
            exit 1
          }
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea-binary-${{ needs.version.outputs.version }}
          path: ${{ env.EA_OUTPUT }}
          retention-days: 90

  # ===========================================================================
  # Job 3: 创建 Release
  # ===========================================================================
  release:
    needs: [version, build]
    if: github.event.inputs.create_release != 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ea-binary-${{ needs.version.outputs.version }}
          path: ./dist
      
      - name: Rename for release
        run: |
          mv dist/Ea_run.ex5 dist/Ea_run_v${{ needs.version.outputs.version }}.ex5
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: EA v${{ needs.version.outputs.version }}
          body: |
            ## EA v${{ needs.version.outputs.version }}
            
            ### 编译信息
            - **分支**: ${{ github.ref_name }}
            - **Commit**: ${{ needs.version.outputs.commit_sha }}
            - **编译时间**: ${{ github.event.head_commit.timestamp }}
            
            ### 文件
            - `Ea_run_v${{ needs.version.outputs.version }}.ex5` - 编译后的 EA
            
            ### 使用方法
            1. 下载 `.ex5` 文件
            2. 复制到 MT5 的 `MQL5/Experts` 目录
            3. 刷新 MT5 导航器
            4. 拖拽到图表即可使用
            
            ### 参数配置
            可加载 `quant_combo_optimized.set` 文件快速配置优化参数。
          files: |
            dist/Ea_run_v${{ needs.version.outputs.version }}.ex5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Job 4: 编译报告
  # ===========================================================================
  report:
    needs: [version, build, release]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ needs.version.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ needs.version.outputs.commit_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Status | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
