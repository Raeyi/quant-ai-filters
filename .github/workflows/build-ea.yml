# =============================================================================
# EA Build & Release Workflow
# =============================================================================
# 触发条件：合并到主分支（EA_2.0.0）时自动构建
# 功能：
#   1. 自动更新版本号
#   2. 编译 EA.ex5
#   3. 创建 GitHub Release
#   4. 上传编译产物
# =============================================================================

name: Build EA & Release

on:
  push:
    branches:
      - EA_2.0.0
    # 只在 merge commit 时触发（里程碑合并）
    # 或者手动触发
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (major/minor/patch)'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch

# 权限配置
permissions:
  contents: write      # 推送代码、创建 tag 和 release

env:
  EA_SOURCE: 'Ea_run.mq5'
  EA_OUTPUT: 'Ea_run.ex5'

jobs:
  # ===========================================================================
  # Job 1: 版本管理
  # ===========================================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get current version
        id: current
        run: |
          # 从 Version.mqh 读取当前版本
          VERSION=$(grep -oP '#define EA_VERSION_STRING\s+"\K[^"]+' Core/Version.mqh || echo "2.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Calculate new version
        id: version
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP="${{ github.event.inputs.version_bump || 'minor' }}"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW_VERSION"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (tag: $TAG)"
      
      - name: Update Version.mqh
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT="${GITHUB_SHA:0:7}"
          
          # 更新版本号
          sed -i "s/#define EA_VERSION_MAJOR.*/#define EA_VERSION_MAJOR    $(echo $NEW_VERSION | cut -d. -f1)/" Core/Version.mqh
          sed -i "s/#define EA_VERSION_MINOR.*/#define EA_VERSION_MINOR    $(echo $NEW_VERSION | cut -d. -f2)/" Core/Version.mqh
          sed -i "s/#define EA_VERSION_PATCH.*/#define EA_VERSION_PATCH    $(echo $NEW_VERSION | cut -d. -f3)/" Core/Version.mqh
          sed -i "s/#define EA_VERSION_STRING.*/#define EA_VERSION_STRING   \"$NEW_VERSION\"/" Core/Version.mqh
          sed -i "s/#define EA_GIT_BRANCH.*/#define EA_GIT_BRANCH     \"$BRANCH\"/" Core/Version.mqh
          sed -i "s/#define EA_GIT_COMMIT.*/#define EA_GIT_COMMIT     \"$COMMIT\"/" Core/Version.mqh
          
          echo "Updated Version.mqh:"
          cat Core/Version.mqh
      
      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Core/Version.mqh
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

  # ===========================================================================
  # Job 2: 编译 EA（使用 GitHub-Hosted Windows Runner）
  # ===========================================================================
  build:
    needs: version
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: EA_2.0.0
      
      - name: Install MT5 MetaEditor
        run: |
          Write-Host "Downloading MT5 portable..."
          
          # 使用官方下载链接
          $url = "https://download.mql5.com/cdn/web/mt5setup.exe"
          $installer = "$env:TEMP\mt5setup.exe"
          
          # 下载安装包
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $webClient = New-Object System.Net.WebClient
          
          try {
            $webClient.DownloadFile($url, $installer)
            Write-Host "Download completed, size: $((Get-Item $installer).Length) bytes"
          } catch {
            Write-Host "Download failed: $($_.Exception.Message)"
            Write-Host "Trying alternative method..."
            # 使用 Invoke-WebRequest 作为备选
            Invoke-WebRequest -Uri $url -OutFile $installer -UserAgent "Mozilla/5.0"
          }
          
          # 验证文件
          if (-not (Test-Path $installer)) {
            Write-Host "ERROR: Installer not found"
            exit 1
          }
          
          $fileSize = (Get-Item $installer).Length
          if ($fileSize -lt 1000000) {
            Write-Host "ERROR: Installer file too small ($fileSize bytes), likely corrupted"
            exit 1
          }
          
          Write-Host "Installing MT5..."
          # 运行安装程序
          $process = Start-Process -FilePath $installer -ArgumentList "/auto" -PassThru -Wait
          Write-Host "Installation exit code: $($process.ExitCode)"
          
          Start-Sleep -Seconds 10
          
          # 查找安装路径
          $possiblePaths = @(
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe",
            "${env:LOCALAPPDATA}\MetaTrader 5\metaeditor64.exe",
            "${env:APPDATA}\MetaTrader 5\metaeditor64.exe"
          )
          
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "Found MetaEditor at: $path"
              echo "MT5_EDITOR=$path" >> $env:GITHUB_ENV
              return
            }
          }
          
          # 如果默认路径没找到，尝试搜索
          $found = Get-ChildItem -Path "C:\" -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "Found MetaEditor at: $($found.FullName)"
            echo "MT5_EDITOR=$($found.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Host "ERROR: MetaEditor not found"
            exit 1
          }
      
      - name: Compile EA
        id: compile
        run: |
          $EDITOR = $env:MT5_EDITOR
          $SOURCE = "${{ github.workspace }}\${{ env.EA_SOURCE }}"
          $LOG = "${{ github.workspace }}\compile.log"
          
          Write-Host "Compiling $SOURCE"
          Write-Host "Using MetaEditor: $EDITOR"
          
          # MetaEditor 命令行编译
          # /compile: 源文件路径
          # /log: 日志输出
          # /include: include 目录
          $includePath = "${{ github.workspace }}"
          & $EDITOR /compile:"$SOURCE" /log:"$LOG" /include:"$includePath"
          
          # 等待编译完成
          Start-Sleep -Seconds 5
          
          # 检查编译结果 - MetaEditor 输出到源文件同目录
          $outputPath = "${{ github.workspace }}\${{ env.EA_OUTPUT }}"
          
          if (Test-Path $outputPath) {
            Write-Host "Compilation successful!"
            Write-Host "Output: $outputPath"
            echo "success=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Compilation failed!"
            if (Test-Path $LOG) {
              Write-Host "=== Compile Log ==="
              Get-Content $LOG
            }
            echo "success=false" >> $env:GITHUB_OUTPUT
            exit 1
          }
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ea-binary-${{ needs.version.outputs.version }}
          path: ${{ env.EA_OUTPUT }}
          retention-days: 90

  # ===========================================================================
  # Job 3: 创建 Release
  # ===========================================================================
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: EA_2.0.0
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ea-binary-${{ needs.version.outputs.version }}
          path: ./dist
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: EA Release ${{ needs.version.outputs.version }}
          body: |
            ## EA v${{ needs.version.outputs.version }}
            
            ### 变更说明
            - 请查看 commit 历史了解详细变更
            
            ### 文件
            - `Ea_run.ex5`: 编译后的 EA 文件
            
            ### 使用方法
            1. 下载 `Ea_run.ex5`
            2. 复制到 MT5 的 `MQL5/Experts` 目录
            3. 刷新 MT5 导航器即可看到
          files: |
            dist/Ea_run.ex5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Job 4: 更新 TODO（可选）
  # ===========================================================================
  update-todo:
    needs: [version, release]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: EA_2.0.0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update TODO with release info
        run: |
          # 可以在这里添加自动更新 TODO 的逻辑
          echo "Release ${{ needs.version.outputs.version }} completed"
